# Atajos personalizados (append: no pisan los defaults de yazi).
[[mgr.append_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/PocketArch-ARM"
desc = "Go ~/PocketArch-ARM"

[[mgr.append_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/project"
desc = "Go ~/project"

[[mgr.append_keymap]]
on   = [ "g", "l" ]
run  = "shell --block -- lazygit"
desc = "Abrir lazygit en el directorio actual"
