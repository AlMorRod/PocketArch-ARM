# Atajos personalizados (append: no pisan los defaults de yazi).
[[mgr.append_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/.pocket-arch"
desc = "Go ~/.pocket-arch"

[[mgr.append_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/project"
desc = "Go ~/project"

[[mgr.append_keymap]]
on   = [ "g", "l" ]
run  = "shell --block -- lazygit"
desc = "Abrir lazygit en el directorio actual"
