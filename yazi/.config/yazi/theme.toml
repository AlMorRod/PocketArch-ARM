# PocketArch — tema Material Monokai (paleta fuente única: CLAUDE.md).
# Adaptado del flavor "dracula" oficial (yazi-rs/flavors) reemplazando cada
# hex por su rol equivalente en la paleta. red y pink de dracula colapsan al
# único rol "rosa/rojo" del CLAUDE.md (#f92672).
# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#66d9ef" }

# Find
find_keyword  = { fg = "#e6db74", bold = true, italic = true, underline = true }
find_position = { fg = "#f92672", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#a6e22e", bg = "#a6e22e" }
marker_cut      = { fg = "#f92672", bg = "#f92672" }
marker_marked   = { fg = "#66d9ef", bg = "#66d9ef" }
marker_selected = { fg = "#e6db74", bg = "#e6db74" }

# Count
count_copied   = { fg = "#1e2327", bg = "#a6e22e" }
count_cut      = { fg = "#1e2327", bg = "#f92672" }
count_selected = { fg = "#1e2327", bg = "#e6db74" }

# Border
border_symbol = "│"
border_style  = { fg = "#67757c" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#1e2327", bg = "#ae81ff", bold = true }
inactive = { fg = "#ae81ff", bg = "#2c353a" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#1e2327", bg = "#ae81ff", bold = true }
normal_alt  = { fg = "#ae81ff", bg = "#2c353a" }

# Select mode
select_main = { fg = "#1e2327", bg = "#66d9ef", bold = true }
select_alt  = { fg = "#66d9ef", bg = "#2c353a" }

# Unset mode
unset_main = { fg = "#1e2327", bg = "#fd971f", bold = true }
unset_alt  = { fg = "#fd971f", bg = "#2c353a" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#67757c" }
perm_type  = { fg = "#ae81ff" }
perm_read  = { fg = "#e6db74" }
perm_write = { fg = "#f92672" }
perm_exec  = { fg = "#a6e22e" }

# Progress
progress_label  = { fg = "#f8f8f2", bold = true }
progress_normal = { fg = "#a6e22e", bg = "#67757c" }
progress_error  = { fg = "#e6db74", bg = "#f92672" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#ae81ff" }
active   = { fg = "#f92672", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#ae81ff" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#ae81ff" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#ae81ff" }
title   = {}
hovered = { fg = "#f92672", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#2c353a" }
cand            = { fg = "#66d9ef" }
rest            = { fg = "#67757c" }
desc            = { fg = "#f92672" }
separator       = "  "
separator_style = { fg = "#67757c" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#66d9ef" }
run     = { fg = "#f92672" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#2c353a", bg = "#f8f8f2" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#ae81ff" }
title    = { fg = "#ae81ff" }
tbl_col  = { fg = "#66d9ef" }
tbl_cell = { fg = "#f92672", bg = "#67757c" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#a6e22e" }
title_warn  = { fg = "#e6db74" }
title_error = { fg = "#f92672" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "image/*", fg = "#66d9ef" },
	# Media
	{ mime = "{audio,video}/*", fg = "#e6db74" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f92672" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#a6e22e" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#67757c" },
	# Fallback
	{ url = "*", fg = "#f8f8f2" },
	{ url = "*/", fg = "#ae81ff" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#f92672" },
	{ name = ".git", text = "", fg = "#66d9ef" },
	{ name = ".github", text = "", fg = "#ae81ff" },
	{ name = ".npm", text = "", fg = "#ae81ff" },
	{ name = "Desktop", text = "", fg = "#66d9ef" },
	{ name = "Development", text = "", fg = "#66d9ef" },
	{ name = "Documents", text = "", fg = "#66d9ef" },
	{ name = "Downloads", text = "", fg = "#66d9ef" },
	{ name = "Library", text = "", fg = "#66d9ef" },
	{ name = "Movies", text = "", fg = "#66d9ef" },
	{ name = "Music", text = "", fg = "#66d9ef" },
	{ name = "Pictures", text = "", fg = "#66d9ef" },
	{ name = "Public", text = "", fg = "#66d9ef" },
	{ name = "Videos", text = "", fg = "#66d9ef" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#f8f8f2" },
	{ if = "link", text = "", fg = "#67757c" },
	{ if = "block", text = "", fg = "#fd971f" },
	{ if = "char", text = "", fg = "#fd971f" },
	{ if = "fifo", text = "", fg = "#fd971f" },
	{ if = "sock", text = "", fg = "#fd971f" },
	{ if = "sticky", text = "", fg = "#fd971f" },
	{ if = "dummy", text = "", fg = "#f92672" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#ae81ff" },
	{ if = "dir", text = "", fg = "#ae81ff" },
	{ if = "exec", text = "", fg = "#a6e22e" },
	{ if = "!dir", text = "", fg = "#f8f8f2" },
]
