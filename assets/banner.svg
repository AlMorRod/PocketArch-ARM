<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="PocketArch — dotfiles · Termux + Arch Linux ARM · 100% CLI">
  <rect width="880" height="220" rx="14" fill="#1e2327"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="13.5" fill="none" stroke="#2c353a"/>

  <!-- chrome de ventana de terminal -->
  <circle cx="30" cy="28" r="7" fill="#f92672"/>
  <circle cx="54" cy="28" r="7" fill="#e6db74"/>
  <circle cx="78" cy="28" r="7" fill="#a6e22e"/>
  <text x="440" y="33" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" fill="#67757c">~/.pocket-arch</text>
  <line x1="1" y1="52" x2="879" y2="52" stroke="#2c353a"/>

  <!-- prompt -->
  <text x="64" y="124" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="54" font-weight="700" textLength="392" lengthAdjust="spacingAndGlyphs"><tspan fill="#a6e22e">❯ </tspan><tspan fill="#f8f8f2">Pocket</tspan><tspan fill="#66d9ef">Arch</tspan></text>
  <rect x="468" y="84" width="24" height="46" fill="#f8f8f2">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- subtítulo -->
  <text x="64" y="164" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="19" fill="#67757c">dotfiles · Termux + Arch Linux ARM · 100% CLI</text>

  <!-- franja de paleta -->
  <clipPath id="bar"><rect x="64" y="188" width="752" height="8" rx="4"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="64"  y="188" width="126" height="8" fill="#f92672"/>
    <rect x="189" y="188" width="126" height="8" fill="#fd971f"/>
    <rect x="314" y="188" width="126" height="8" fill="#e6db74"/>
    <rect x="439" y="188" width="126" height="8" fill="#a6e22e"/>
    <rect x="564" y="188" width="126" height="8" fill="#66d9ef"/>
    <rect x="689" y="188" width="127" height="8" fill="#ae81ff"/>
  </g>
</svg>
