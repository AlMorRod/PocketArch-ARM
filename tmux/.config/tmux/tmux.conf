# PocketArch — tmux.conf
# Colores Material Monokai: Fase 6 (esta fase es solo funcional).

# --- Terminal / color ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10          # evita el lag de <Esc> en nvim
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on

# --- Navegación estilo Vim entre panes (prefix + hjkl) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar panes estilo Vim (prefix + HJKL, repetible)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy-mode con teclas de Vim
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Splits más intuitivos, manteniendo el cwd actual ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Recargar config sin salir
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recargado"

# --- Barra inferior minimalista ---
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 20
set -g status-right-length 60
set -g status-left "#[bold] #S "
set -g status-right "%Y-%m-%d %H:%M"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
