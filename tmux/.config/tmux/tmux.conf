# PocketArch — tmux.conf
# Tema Material Monokai (paleta fuente única: CLAUDE.md).

# --- Terminal / color ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10          # evita el lag de <Esc> en nvim
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on

# --- Navegación estilo Vim entre panes (prefix + hjkl) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar panes estilo Vim (prefix + HJKL, repetible)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy-mode con teclas de Vim
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Splits más intuitivos, manteniendo el cwd actual ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Recargar config sin salir
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recargado"

# --- Barra inferior minimalista ---
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 20
set -g status-right-length 60
set -g status-left "#[bold] #S "
set -g status-right "%Y-%m-%d %H:%M"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# --- Tema Material Monokai ---
# Fondo base #1e2327 · Superficie #232a2e · Superficie alta #2c353a
# Texto #f8f8f2 · Tenue #67757c · Rosa #f92672 · Verde #a6e22e · Cian #66d9ef
set -g status-style "bg=#2c353a,fg=#f8f8f2"
set -g status-left-style "bg=#f92672,fg=#1e2327,bold"
set -g status-right-style "bg=#2c353a,fg=#67757c"
setw -g window-status-current-style "bg=#a6e22e,fg=#1e2327,bold"
setw -g window-status-style "bg=#2c353a,fg=#67757c"

set -g pane-border-style "fg=#67757c"
set -g pane-active-border-style "fg=#66d9ef"

set -g message-style "bg=#232a2e,fg=#e6db74"
set -g message-command-style "bg=#232a2e,fg=#e6db74"

setw -g mode-style "bg=#2c353a,fg=#f92672"  # copy-mode selection
